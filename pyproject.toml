[project]
name = "landers"
version = "0.0.1"
description = "Search of public Mars orbital imagery for spacecraft that never called home."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "glymur>=0.13",
  "pillow>=10",
  "openai>=3.41.0",
  "meta-sam-parser>=0.1.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
rerank = ["torch>=2.2", "transformers>=4.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["landers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: reads large windows from real strips"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
